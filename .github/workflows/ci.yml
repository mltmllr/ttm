name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (prüft Frontmatter, Dateinamen und FAQ aller Beiträge)
        run: npm run build
      - name: Linkcheck dist
        run: node scripts/check-links.mjs dist
      - name: Fixture-Build (Testbeiträge, nie veröffentlicht)
        run: npm run build:fixtures
      - name: Linkcheck dist-fixtures
        run: node scripts/check-links.mjs dist-fixtures
